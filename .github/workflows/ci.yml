name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The gate: any spec with an error (or a warning, under --strict) fails the build.
      - run: iacforge validate examples/webapp.yaml examples/api-dev.yaml --strict

  terraform:
    needs: validate-specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: iacforge generate examples/webapp.yaml -o build/webapp
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
        working-directory: build/webapp
      - run: terraform validate
        working-directory: build/webapp
