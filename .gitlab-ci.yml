stages:
  - test
  - validate
  - generate

default:
  image: python:3.12-slim

unit-tests:
  stage: test
  script:
    - pip install -e ".[dev]"
    - pytest -q

# Pre-deployment gate: a failing spec stops the pipeline before any Terraform is produced.
validate-specs:
  stage: validate
  script:
    - pip install -e .
    - iacforge validate examples/webapp.yaml examples/api-dev.yaml --strict

generate-terraform:
  stage: generate
  script:
    - pip install -e .
    - iacforge generate examples/webapp.yaml -o build/webapp
  artifacts:
    paths:
      - build/webapp/
    expire_in: 1 week
